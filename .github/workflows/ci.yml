name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - name: Deploy Worker and apply D1 migrations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "CF_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or CLOUDFLARE_D1_DATABASE_ID is not set. Skipping deploy."
            exit 0
          fi
          python3 - << 'PY'
          import os, pathlib
          path = pathlib.Path("wrangler.jsonc")
          text = path.read_text()
          placeholder = "00000000-0000-0000-0000-000000000000"
          database_id = os.environ["CLOUDFLARE_D1_DATABASE_ID"]
          if placeholder not in text:
              raise SystemExit("wrangler.jsonc is missing the database_id placeholder")
          path.write_text(text.replace(placeholder, database_id, 1))
          PY
          npx wrangler d1 migrations apply week-on-plate-db --remote
          npx wrangler deploy --var BUILD_SHA:${GITHUB_SHA} --var APP_VERSION:0.1.2

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan commits since main
        run: gitleaks detect --source . --log-opts="origin/main..HEAD" --redact --exit-code 1
      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --redact --exit-code 1

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign
